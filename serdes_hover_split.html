<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SERDES – Hover Split</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 32px;
    }
    h1 { color: #ffffff33; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
    .stage { position: relative; width: 500px; height: 512px; cursor: pointer; }
    .half { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .half img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
    .stage:hover .half-left  { transform: translate(-12%, -12%); }
    .stage:hover .half-right { transform: translate( 12%,  12%); }
  </style>
</head>
<body>
  <h1>hover to split</h1>
  <div class="stage">
    <div class="half half-left">
      <img src="SERDES_LEFT.svg" alt="Left half" />
    </div>
    <div class="half half-right">
      <img src="SERDES_RIGHT.svg" alt="Right half" />
    </div>
  </div>
</body>
</html>
