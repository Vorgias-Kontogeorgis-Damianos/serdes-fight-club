server {
    server_name serdesfightclub.gr www.serdesfightclub.gr;

    root /var/www/serdes-fight-club;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # This site is not installable as a web app. Do not let the SPA fallback
    # serve HTML at the former manifest URL.
    location = /site.webmanifest {
        return 404;
    }

    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|webp|avif|svg|png|jpe?g|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location ~* \.(?:mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header Accept-Ranges bytes always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/serdesfightclub.gr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/serdesfightclub.gr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    include /etc/nginx/snippets/hsts.conf;
}

server {
    if ($host = www.serdesfightclub.gr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = serdesfightclub.gr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name serdesfightclub.gr www.serdesfightclub.gr;
    return 404; # managed by Certbot
}
