# Include in nginx's http {} block.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

# Optional when the ngx_brotli module is installed:
# brotli on;
# brotli_comp_level 5;
# brotli_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;
