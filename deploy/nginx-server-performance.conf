# Include in the serdesfightclub.gr server {} block.

# Hashed Vite assets can be cached permanently and safely invalidated by filename.
location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~* \.(?:woff2|webp|avif|svg|png|jpe?g|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    try_files $uri =404;
}

location ~* \.(?:mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    add_header Accept-Ranges bytes always;
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
}
